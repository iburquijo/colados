# Mosquitto para desarrollo local. Sin autenticación (ADR-0014): esto corre en
# localhost y el modelo de amenaza es literalmente nadie.
listener 1883
allow_anonymous true

# Sin persistencia: el broker reparte y olvida. El histórico vive en PostgreSQL
# (ADR-0009). Si Mosquitto se reinicia no se pierde nada que importe.
persistence false

log_dest stdout
log_type warning
log_type error
connection_messages true
