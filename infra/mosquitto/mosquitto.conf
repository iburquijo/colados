# Mosquitto para desarrollo local. Sin autenticación (ADR-0014): esto corre en
# localhost y el modelo de amenaza es literalmente nadie.
# Se ata explicitamente a 0.0.0.0: sin direccion, Mosquitto abre tambien un
# socket IPv6 y en hosts sin IPv6 (contenedores, CI) arranca escupiendo
# "Address family not supported by protocol". Dentro del contenedor 0.0.0.0 solo
# alcanza a la red de Compose; quien expone el puerto fuera es el mapeo 1883:1883.
listener 1883 0.0.0.0
allow_anonymous true

# Sin persistencia: el broker reparte y olvida. El histórico vive en PostgreSQL
# (ADR-0009). Si Mosquitto se reinicia no se pierde nada que importe.
persistence false

log_dest stdout
log_type warning
log_type error
connection_messages true
