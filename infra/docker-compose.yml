name: colados

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: colados-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 2 -q 0 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: colados-postgres
    environment:
      POSTGRES_DB: colados
      POSTGRES_USER: colados
      POSTGRES_PASSWORD: colados
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colados -d colados"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
